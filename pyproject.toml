[project]
name = "pldc-legal-rag"
version = "1.0.0"
description = "Agentic Legal RAG Chatbot & Deterministic Legal Calculators for Vietnamese General Law (PLDC)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-genai>=1.0.0",
    "python-pptx>=1.0.2",
    "pymupdf>=1.25.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.7.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
